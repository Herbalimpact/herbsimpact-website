# Netlify configuration for herbsimpact-website
#
# Runs the blog build script before every deploy so that saving a post in
# Decap CMS (which only edits the Markdown files in content/blog/) always
# regenerates the matching static blog-N.html page before the site is
# published. Every other page is still a plain static HTML file that is
# published as-is, with no build step required.

[build]
  command = "node scripts/build-blog.js"
  publish = "."
