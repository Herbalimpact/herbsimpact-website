# Netlify configuration for herbsimpact-website
#
# Runs the blog + pages build scripts before every deploy so that saving
# content in Decap CMS (which only edits the Markdown files in content/blog/
# and content/pages/) always regenerates the matching static HTML pages
# before the site is published. Every published page is still a plain
# static HTML file with no client-side build step required to view it.

[build]
  command = "npm install && npm run build"
  publish = "."
