backend: {name: git-gateway, branch: main}
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
collections: [{name: pages, label: Pages, files: [{name: home, label: "Home Page", file: index.html, format: frontmatter, fields: [{label: "Page HTML", name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true}]}, {name: about, label: "About Page", file: about.html, format: frontmatter, fields: [{label: "Page HTML", name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true}]}, {name: blog_index, label: "Blog Index Page", file: blog.html, format: frontmatter, fields: [{label: "Page HTML", name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true}]}, {name: contact, label: "Contact Page", file: contact.html, format: frontmatter, fields: [{label: "Page HTML", name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true}]}, {name: downloads, label: "Downloads Page", file: downloads.html, format: frontmatter, fields: [{label: "Page HTML", name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true}]}, {name: store, label: "Store Page", file: store.html, format: frontmatter, fields: [{label: "Page HTML", name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true}]}, {name: tools, label: "Tools Page", file: tools.html, format: frontmatter, fields: [{label: "Page HTML", name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true}]}, {name: videos, label: "Videos Page", file: videos.html, format: frontmatter, fields: [{label: "Page HTML", name: body, widget: code, default_language: html, allow_language_selection: false, output_code_only: true}]}]}, {name: blog_posts, label: "Blog Posts", folder: "content/blog", create: true, slug: "{{slug}}", format: frontmatter, fields: [{label: "Title", name: title, widget: string}, {label: "Category", name: category, widget: string, hint: "Small eyebrow label above the title, e.g. GETTING STARTED"}, {label: "Read time", name: read_time, widget: string, hint: "e.g. 6 MIN READ"}, {label: "Cover image", name: cover_image, widget: image}, {label: "Cover image alt text", name: cover_image_alt, widget: string}, {label: "Swahili version link", name: swahili_link, widget: string, required: false, hint: "Filename of the matching translated post, e.g. blog-1-sw.html"}, {label: "SEO description", name: description, widget: string, required: false, hint: "Used for search engines and link previews"}, {label: "Body", name: body, widget: markdown}]}]
